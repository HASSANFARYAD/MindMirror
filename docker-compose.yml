services:

  ollama:
    image: ollama/ollama:latest
    container_name: mindmirror_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull llama3.2:3b &&
             wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: mindmirror_postgres
    environment:
      POSTGRES_DB: mindmirror
      POSTGRES_USER: mindmirror_user
      POSTGRES_PASSWORD: mindmirror_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmirror_user -d mindmirror"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: mindmirrorregistry.azurecr.io/mindmirror-backend:latest   # ← CHANGED
    container_name: mindmirror_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FRONTEND_PORT=3000
      - FRONTEND_ORIGIN=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - DATABASE_URL=postgresql://mindmirror_user:mindmirror_pass@postgres:5432/mindmirror
      - WHISPER_MODEL=base
      - HF_HOME=/app/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - hf_cache:/app/.cache/huggingface   # ← removed ./backend:/app (dev-only)
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); raise SystemExit(0 if d.get('status') == 'ok' else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    # image: mindmirrorregistry.azurecr.io/mindmirror-frontend:latest   # ← CHANGED
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mindmirror_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_PORT=8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "HOST_IP=$(hostname -i | awk '{print $1}'); wget -qO- http://$$HOST_IP:3000 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ollama_data:
  postgres_data:
  hf_cache: