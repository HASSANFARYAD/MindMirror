databases:
  - name: mindmirror-db
    plan: free

services:
  - type: web
    runtime: docker
    name: mindmirror-backend
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /health
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: tiny
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: DATABASE_URL
        fromDatabase:
          name: mindmirror-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://mindmirror-frontend.onrender.com
      - key: ENV_MODE
        value: production
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        value: mailto:admin@mindmirror.app

  - type: web
    runtime: docker
    name: mindmirror-frontend
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    startCommand: node server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mindmirror-backend.onrender.com
